<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1145" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.08)" stroke-width="1" />
    </pattern>

    <!-- Glowing Pill / Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid { fill: url(#cyberGrid); }
    
    /* Dynamic pulsing orbs in background */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.35; }
      50% { transform: translate(40px, 20px) scale(1.15); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.25; }
      50% { transform: translate(-30px, -25px) scale(1.2); opacity: 0.45; }
    }
    @keyframes pulseDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .orb-1 {
      animation: pulseOrb1 9s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb2 11s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .animated-wire {
      stroke-dasharray: 8 12;
      animation: pulseDash 6s linear infinite;
    }
    .pill-floating {
      animation: floatPill 5s ease-in-out infinite;
    }
    .pill-delayed {
      animation: floatPill 5s ease-in-out infinite;
      animation-delay: -2.5s;
    }

    /* Typography */
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 54px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .brand-highlight {
      fill: url(#primaryGrad);
    }
    .brand-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 2px;
      fill: #38bdf8;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" class="bg" rx="16" />
  <rect width="1200" height="420" class="grid" rx="16" />

  <!-- Dynamic Background Lights (Stay completely behind content) -->
  <g class="orb-1" filter="url(#softGlow)">
    <circle cx="220" cy="110" r="160" fill="#38bdf8" />
  </g>
  <g class="orb-2" filter="url(#softGlow)">
    <circle cx="1020" cy="310" r="180" fill="#a855f7" />
  </g>

  <!-- Animated Circuit Streamlines (Decorative, positioned in background) -->
  <g opacity="0.35">
    <path class="animated-wire" d="M 0,90 Q 300,160 600,80 T 1200,140" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="animated-wire" d="M 0,330 Q 400,260 800,340 T 1200,280" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Modern Corner Tech Brackets -->
  <path d="M 30,60 L 30,30 L 60,30" fill="none" stroke="rgba(148, 163, 184, 0.3)" stroke-width="2" stroke-linecap="round" />
  <path d="M 1170,60 L 1170,30 L 1140,30" fill="none" stroke="rgba(148, 163, 184, 0.3)" stroke-width="2" stroke-linecap="round" />
  <path d="M 30,360 L 30,390 L 60,390" fill="none" stroke="rgba(148, 163, 184, 0.3)" stroke-width="2" stroke-linecap="round" />
  <path d="M 1170,360 L 1170,390 L 1140,390" fill="none" stroke="rgba(148, 163, 184, 0.3)" stroke-width="2" stroke-linecap="round" />

  <!-- TOP PILL: CATEGORY BADGE -->
  <g transform="translate(600, 70)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="-110" cy="0" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="5" text-anchor="middle" class="tagline">AUTOMATION ECOSYSTEM 2026</text>
  </g>

  <!-- FOREGROUND HERO TITLE & SUBTITLE (Clear, High Contrast, Prominent) -->
  <!-- Subtle backplate to ensure pristine text clarity in all renderers -->
  <rect x="150" y="115" width="900" height="150" rx="20" fill="rgba(10, 15, 29, 0.55)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  
  <text x="600" y="180" text-anchor="middle" class="brand-title">
    Awesome <tspan class="brand-highlight">Automated Testing</tspan> Frameworks
  </text>
  
  <text x="600" y="230" text-anchor="middle" class="brand-subtitle">
    Curated Hub for Enterprise SaaS QA Clouds &amp; Open-Source Testing Libraries
  </text>

  <!-- DYNAMIC BOTTOM FEATURE PILLS (Playwright, Cypress, Selenium, Real Devices, etc.) -->
  <g transform="translate(600, 325)">
    <!-- Pill 1: E2E Browser Testing -->
    <g class="pill-floating" transform="translate(-460, 0)">
      <rect x="0" y="-22" width="200" height="44" rx="22" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <text x="100" y="6" text-anchor="middle" class="pill-text">⚡ E2E Browser QA</text>
    </g>

    <!-- Pill 2: Real Devices & Cloud Grids -->
    <g class="pill-delayed" transform="translate(-230, 0)">
      <rect x="0" y="-22" width="210" height="44" rx="22" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" />
      <text x="105" y="6" text-anchor="middle" class="pill-text">📱 Real Device Clouds</text>
    </g>

    <!-- Pill 3: Mobile Native & Hybrid -->
    <g class="pill-floating" transform="translate(10, 0)">
      <rect x="0" y="-22" width="205" height="44" rx="22" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
      <text x="102" y="6" text-anchor="middle" class="pill-text">🤖 AI Self-Healing</text>
    </g>

    <!-- Pill 4: API & Performance Testing -->
    <g class="pill-delayed" transform="translate(245, 0)">
      <rect x="0" y="-22" width="215" height="44" rx="22" fill="url(#cardGrad)" stroke="rgba(34, 211, 238, 0.4)" stroke-width="1.5" />
      <text x="107" y="6" text-anchor="middle" class="pill-text">🚀 Performance &amp; API</text>
    </g>
  </g>
</svg>
